services:
  spark:
    image: apache/spark-py:v3.4.0
    working_dir: /app
    environment:
      - HOME=/tmp
    volumes:
      - .:/app

  jupyter:
    image: jupyter/pyspark-notebook:latest
    working_dir: /home/jovyan/work
    volumes:
      - .:/home/jovyan/work
    ports:
      - "8888:8888"
    command: start-notebook.sh --NotebookApp.token=''

